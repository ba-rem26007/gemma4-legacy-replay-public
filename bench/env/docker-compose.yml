# PrestaShop release (image officielle) + MySQL. Tag choisi par checkout.sh selon le bug.
services:
  db:
    image: ${DB_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-padmin"]
      interval: 5s
      retries: 30
  ps:
    image: prestashop/prestashop:${PS_TAG:-8.1.7}
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_SERVER: db
      DB_PASSWD: admin
      DB_NAME: prestashop
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_DOMAIN: localhost:${PS_PORT:-8081}
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-done
      PS_LANGUAGE: fr
      PS_COUNTRY: FR
      ADMIN_MAIL: demo@prestashop.com
      ADMIN_PASSWD: prestashop_demo
    ports:
      - "127.0.0.1:${PS_PORT:-8081}:80"
